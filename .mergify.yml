# File de merge Mergify — BaptisteFaisy/Muse.
#
# Muse demarre sans gate IA ni batterie de tests : les queue_conditions
# n'exigent donc aucun check inexistant (le socle CI est en dry-run —
# variable de depot HERMES_LITE_DRY_RUN=1). Quand la CI reelle de Muse
# existera, ajouter dans queue_conditions :
#   - check-success = "<check reel>"
# Structure copiée du .mergify.yml de BaptisteFaisy/duello (décision
# user 2026-10-10) : inline labels urgent / priority-low identiques.
queue_rules:
  - name: default
    queue_conditions:
      - -conflict
      - -draft
      - base = main
    batch_size:
      min: 1
      max: 3
    batch_max_wait_time: "30 seconds"
    max_checks_retries: 1
    merge_method: rebase
    update_method: rebase

priority_rules:
  - name: urgent
    conditions:
      - label = urgent
    priority: high
  - name: priority-low
    conditions:
      - label = priority-low
    priority: low

merge_queue:
  # 10 workers self-hosted (R630, labels muse-worker) ; la speculation
  # Mergify reste bornee a 4, ajustable.
  max_parallel_checks: 4

# Auto-queue natif (produit Merge Queue) : évite de dépendre du produit
# « Workflow Automation » (pull_request_rules), constaté désactivé le 24/10.
merge_protections_settings:
  auto_merge_conditions: true
