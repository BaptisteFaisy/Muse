name: hermes-lite (escalade conflit — alerte)

# Alerte humaine : liste les PR portant hermes/conflit. Lancement manuel
# (workflow_dispatch) — pas de cron (dépôts privés = facturés). Le gate
# pose le label ; ce workflow ne fait qu'imprimer l'état.

on:
  workflow_dispatch: {}

permissions:
  pull-requests: read

jobs:
  alert:
    name: Lister les PR en conflit
    runs-on: [self-hosted, muse-worker]
    timeout-minutes: 5
    steps:
      - name: Rapport
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          echo "PR ouvertes portant hermes/conflit :"
          curl -sS -H "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/issues?state=open&labels=hermes/conflit&per_page=100" \
            | python3 -c "
                import sys, json
                items = json.load(sys.stdin)
                if not items:
                    print('  (aucune)')
                for it in items:
                    print('  #{} {}'.format(it['number'], it['title']))
                "
